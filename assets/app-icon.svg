<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ohmtools app icon template (DESIGN.md, "App icon"), taken from
       zeiteisen's public/logo.svg. Keep the backdrop and the rim as they are:
       zeiteisen's scripts/app-icons.mjs finds them by `rx="112" ry="112"` and
       `stroke-opacity="0.12"` to render the full-bleed PNGs. Draw the glyph
       flat in the group below, inside the maskable safe zone: the circle
       cx 256, cy 256, r 204.8. Colours: white #FAFAFA, the dark face
       #0A0A0A, the red accent #DC2626, the data colours' dark-mode borders
       (orange #F97316, blue #2563EB, teal #0D9488, violet #7C3AED, lime
       #84CC16); shapes rounded with rx 12. No gradients. -->

  <!-- Squircle backdrop -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#000000"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="111.3" ry="111.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Glyph -->
  <g>
  </g>
</svg>
