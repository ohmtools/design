<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The ohmtools icon (DESIGN.md, "ohmtools logo"): the omega on a circuit
       board. The circuit belongs to the icon only; every other use shows the
       omega alone (mark-*.svg, wordmark-*.svg, favicon.svg). Backdrop and rim
       as in ../app-icon.svg. -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#000000"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="111.3" ry="111.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Circuit: capacitor (left), switch, series resistor and wiper (right,
       top). Every line ends at a terminal of the omega or at a pad. -->
  <path d="M128 366H88L56 334V236M56 220V144L96 104M384 366H416L448 334V272M448 224V120L400 72H256V92" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 236H76M36 220H76M448 272L424 232" fill="none" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  <rect x="304" y="62" width="48" height="20" rx="4" fill="#000000" stroke="#333333" stroke-width="8"/>
  <path d="M256 120L242 92H270Z" fill="#333333"/>
  <g fill="#000000" stroke="#333333" stroke-width="6">
    <circle cx="96" cy="104" r="12"/>
    <circle cx="448" cy="272" r="8"/>
    <circle cx="448" cy="224" r="8"/>
  </g>

  <!-- Omega: a potentiometer, its right terminal the red accent -->
  <path d="M128 366H200L212 334.3A104 104 0 1 1 300 334.3L312 366H384" fill="none" stroke="#FAFAFA" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="366" r="30" fill="#FAFAFA"/>
  <circle cx="384" cy="366" r="30" fill="#DC2626"/>
</svg>
